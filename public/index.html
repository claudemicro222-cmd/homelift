<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HomeLift">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>HomeLift</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><img src="/icon.svg" alt="">HomeLift</a>
    <button id="userBtn" class="icon-btn" hidden></button>
    <button id="settingsBtn" class="icon-btn" hidden></button>
  </header>
  <div id="netbar" class="netbar" hidden></div>
  <main id="app" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" hidden></nav>
  <div id="timer" class="timer" hidden></div>
  <dialog id="modal"><div id="modalBody"></div></dialog>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
